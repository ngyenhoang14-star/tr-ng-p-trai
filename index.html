<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Thảo 💗</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #fff;
    color: #70455f;
}

/* ==================================================
   CÁC MÀN HÌNH
================================================== */

.screen {
    position: fixed;
    inset: 0;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    opacity: 0;
    visibility: hidden;

    transition:
        opacity .8s ease,
        visibility .8s ease;

    overflow: hidden;
}

.screen.active {
    opacity: 1;
    visibility: visible;
}


/* ==================================================
   MÀN ĐẦU
   CHỈ CÓ LỜI NHẠC
================================================== */

#screenLyrics {
    background:
        radial-gradient(
            circle at center,
            #ffffff 0%,
            #fffafa 50%,
            #fdf3f8 100%
        );
}

.opening-lyrics-wrap {
    width: min(92vw, 950px);

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 30px;
}

.opening-lyrics {
    max-width: 100%;

    font-size: clamp(22px, 4vw, 42px);
    line-height: 1.45;

    font-weight: 700;
    text-align: center;

    color: #70455f;

    opacity: 0;
    transform: translateY(18px) scale(.97);

    transition:
        opacity .65s cubic-bezier(.22,1,.36,1),
        transform .65s cubic-bezier(.22,1,.36,1);

    text-shadow:
        0 3px 15px rgba(150, 80, 120, .12);
}

.opening-lyrics.show {
    opacity: 1;
    transform: translateY(0) scale(1);
}


/* ==================================================
   MÀN CÒN 17 GIÂY
================================================== */

#screenPrepare {
    background:
        radial-gradient(
            circle at center,
            #ffffff 0%,
            #fff7fb 55%,
            #f9edf4 100%
        );
}

.prepare-content {
    display: flex;
    flex-direction: column;
    align-items: center;

    text-align: center;

    z-index: 5;
}

.prepare-title {
    font-size: clamp(38px, 7vw, 68px);
    font-weight: 700;

    color: #70455f;

    opacity: 0;
    transform: translateY(20px);

    animation:
        introAppear .8s
        cubic-bezier(.22,1,.36,1)
        forwards;
}

.prepare-text {
    margin-top: 10px;

    font-size: clamp(17px, 3vw, 25px);

    color: #8d6079;

    opacity: 0;
    transform: translateY(15px);

    animation:
        introAppear .8s
        cubic-bezier(.22,1,.36,1)
        .12s forwards;
}


/* ==================================================
   HỘP QUÀ
================================================== */

.gift {
    margin-top: 25px;

    font-size: clamp(90px, 15vw, 160px);

    cursor: pointer;
    user-select: none;

    opacity: 0;

    transform:
        scale(.7)
        translateY(20px);

    animation:
        giftAppear .9s
        cubic-bezier(.22,1,.36,1)
        .25s forwards,

        giftFloat 2s
        ease-in-out
        1.15s infinite;
}


/* ==================================================
   LOADING
================================================== */

.loading-container {
    width: min(350px, 75vw);

    margin-top: 20px;

    opacity: 0;

    animation:
        introAppear .8s
        ease
        .4s forwards;
}

.loading-bar-background {
    width: 100%;
    height: 12px;

    background: rgba(0,0,0,.08);

    border-radius: 50px;

    overflow: hidden;
}

#loadingBar {
    width: 1%;
    height: 100%;

    border-radius: 50px;

    background:
        linear-gradient(
            90deg,
            #b96d99,
            #d991b5,
            #e7b0ca
        );

    transition: width .05s linear;
}

#loadingPercent {
    margin-top: 9px;

    font-size: 15px;

    color: #a07891;

    font-weight: 600;
}


/* ==================================================
   LỜI NHẠC Ở MÀN HAPPY BIRTHDAY
================================================== */

.final-lyrics {
    position: fixed;

    left: 50%;
    bottom: 5vh;

    transform: translateX(-50%);

    width: min(92vw, 950px);

    display: flex;
    justify-content: center;
    align-items: center;

    z-index: 100;

    pointer-events: none;
}

.final-lyrics-text {
    max-width: 95%;

    padding: 12px 25px;

    border-radius: 999px;

    background: rgba(255,255,255,.58);

    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);

    border:
        1px solid
        rgba(255,255,255,.75);

    color: #8c3d68;

    font-size: clamp(18px, 3vw, 30px);

    line-height: 1.35;

    font-weight: 700;

    text-align: center;

    opacity: 0;

    transform:
        translateY(15px)
        scale(.96);

    transition:
        opacity .6s
        cubic-bezier(.22,1,.36,1),

        transform .6s
        cubic-bezier(.22,1,.36,1);

    text-shadow:
        0 2px 12px
        rgba(180,60,130,.18);
}

.final-lyrics-text.show {
    opacity: 1;

    transform:
        translateY(0)
        scale(1);
}


/* ==================================================
   HAPPY BIRTHDAY
================================================== */

#screenFinal {
    background:
        radial-gradient(
            circle at 50% 30%,
            #fff 0%,
            #fff7fb 45%,
            #f9e8f1 100%
        );

    text-align: center;
}

.final-small {
    font-size: clamp(13px, 2vw, 18px);

    letter-spacing: 2px;

    color: #a06b87;

    margin-bottom: 10px;

    animation:
        finalAppear 1s ease forwards;
}

.final-title {
    font-size: clamp(42px, 9vw, 90px);

    font-weight: 800;

    background:
        linear-gradient(
            90deg,
            #a34f7d,
            #d27ca5,
            #a34f7d
        );

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;

    animation:
        finalTitleAppear 1s
        cubic-bezier(.22,1,.36,1)
        forwards;
}

.final-name {
    margin-top: 5px;

    font-size: clamp(35px, 7vw, 65px);

    font-weight: 700;

    color: #8c3d68;

    animation:
        finalAppear 1s ease .2s
        both;
}

.cake {
    margin-top: 12px;

    font-size: clamp(65px, 10vw, 100px);

    animation:
        cakeAppear 1s
        cubic-bezier(.22,1,.36,1)
        .3s both;
}

.message {
    max-width: 650px;

    padding: 0 25px;

    margin-top: 15px;

    font-size: clamp(15px, 2.2vw, 20px);

    line-height: 1.7;

    color: #806072;

    animation:
        finalAppear 1s ease .45s
        both;
}

.message strong {
    color: #a34f7d;
}


/* ==================================================
   NÚT NHẠC
================================================== */

.music-button {
    position: fixed;

    right: 20px;
    top: 20px;

    width: 48px;
    height: 48px;

    z-index: 200;

    display: none;

    border: 1px solid
        rgba(255,255,255,.7);

    border-radius: 50%;

    background:
        rgba(255,255,255,.6);

    backdrop-filter: blur(10px);

    cursor: pointer;

    font-size: 20px;

    box-shadow:
        0 5px 20px
        rgba(120,70,100,.12);
}


/* ==================================================
   TIM BAY
================================================== */

.floating {
    position: fixed;

    bottom: -60px;

    z-index: 20;

    pointer-events: none;

    animation:
        floatUp linear forwards;
}


/* ==================================================
   CONFETTI
================================================== */

.confetti {
    position: fixed;

    top: -20px;

    width: 8px;
    height: 14px;

    z-index: 15;

    border-radius: 2px;

    pointer-events: none;

    animation:
        confettiFall linear forwards;
}


/* ==================================================
   SPARKLE
================================================== */

.sparkle {
    position: fixed;

    z-index: 25;

    color: #d98ab0;

    font-size: 20px;

    pointer-events: none;

    animation:
        sparkleAnimation 3s ease forwards;
}


/* ==================================================
   ANIMATION
================================================== */

@keyframes introAppear {

    from {
        opacity: 0;
        transform: translateY(20px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}


@keyframes giftAppear {

    from {
        opacity: 0;
        transform:
            scale(.7)
            translateY(20px);
    }

    to {
        opacity: 1;
        transform:
            scale(1)
            translateY(0);
    }
}


@keyframes giftFloat {

    0%,
    100% {
        transform:
            translateY(0)
            rotate(0deg);
    }

    50% {
        transform:
            translateY(-12px)
            rotate(-2deg);
    }
}


@keyframes finalAppear {

    from {
        opacity: 0;
        transform: translateY(15px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}


@keyframes finalTitleAppear {

    from {
        opacity: 0;
        transform:
            scale(.85)
            translateY(20px);
    }

    to {
        opacity: 1;
        transform:
            scale(1)
            translateY(0);
    }
}


@keyframes cakeAppear {

    from {
        opacity: 0;
        transform:
            scale(.5)
            translateY(20px);
    }

    to {
        opacity: 1;
        transform:
            scale(1)
            translateY(0);
    }
}


@keyframes floatUp {

    0% {
        transform:
            translateY(0)
            rotate(0deg);

        opacity: 0;
    }

    10% {
        opacity: 1;
    }

    100% {
        transform:
            translateY(-115vh)
            rotate(25deg);

        opacity: 0;
    }
}


@keyframes confettiFall {

    0% {
        transform:
            translateY(0)
            rotate(0deg);

        opacity: 1;
    }

    100% {
        transform:
            translateY(110vh)
            rotate(720deg);

        opacity: 0;
    }
}


@keyframes sparkleAnimation {

    0% {
        opacity: 0;
        transform: scale(.3);
    }

    30% {
        opacity: 1;
        transform: scale(1.2);
    }

    70% {
        opacity: 1;
    }

    100% {
        opacity: 0;
        transform: scale(.3);
    }
}


/* ==================================================
   MOBILE
================================================== */

@media (max-width: 600px) {

    .opening-lyrics {
        font-size: 20px;
    }

    .prepare-title {
        font-size: 40px;
    }

    .prepare-text {
        font-size: 17px;
    }

    .gift {
        font-size: 100px;
    }

    .final-lyrics {
        bottom: 3vh;
    }

    .final-lyrics-text {
        font-size: 17px;
        padding: 10px 16px;
        border-radius: 22px;
    }

    .music-button {
        right: 12px;
        top: 12px;
    }

    .message {
        font-size: 15px;
    }
}
</style>
</head>


<body>

<!-- ==================================================
     MÀN 1: CHỈ LỜI NHẠC
================================================== -->

<section id="screenLyrics" class="screen active">

    <div class="opening-lyrics-wrap">

        <div
            id="openingLyrics"
            class="opening-lyrics">
        </div>

    </div>

</section>


<!-- ==================================================
     MÀN 2:
     CÒN 17 GIÂY → THẢO ƠI + QUÀ + LOADING
================================================== -->

<section id="screenPrepare" class="screen">

    <div class="prepare-content">

        <div class="prepare-title">
            Thảo ơi
        </div>

        <div class="prepare-text">
            Có một món nhỏ dành cho Thảo nè...
        </div>

        <div
            id="gift"
            class="gift">
            🎁
        </div>

        <div class="loading-container">

            <div class="loading-bar-background">

                <div
                    id="loadingBar">
                </div>

            </div>

            <div id="loadingPercent">
                1%
            </div>

        </div>

    </div>

</section>


<!-- ==================================================
     MÀN CUỐI
================================================== -->

<section id="screenFinal" class="screen">

    <div class="final-small">
        ✨ HÔM NAY CÓ MỘT NGƯỜI ĐẶC BIỆT ✨
    </div>

    <div class="final-title">
        Happy Birthday
    </div>

    <div class="final-name">
        Thảo 💗
    </div>

    <div class="cake">
        🎂
    </div>

    <div class="message">

        Chúc Thảo sinh nhật vui vẻ,
        tuổi mới luôn vui vẻ và hạnh phúc nhé 💕
        <br>

        Mong những điều tốt đẹp nhất
        sẽ luôn đến với Thảo.
        <br>

        <strong>
            Happy Birthday cô gái đáng yêu 🎀💗
        </strong>

    </div>

    <!-- LỜI BÀI HÁT -->
    <div class="final-lyrics">

        <div
            id="finalLyrics"
            class="final-lyrics-text">
        </div>

    </div>

</section>


<!-- ==================================================
     NÚT NHẠC
================================================== -->

<button
    id="musicButton"
    class="music-button"
    aria-label="Bật hoặc tắt nhạc">

    🔊

</button>


<!-- ==================================================
     NHẠC
     ĐẶT music.mp3 CÙNG THƯ MỤC VỚI FILE HTML
================================================== -->

<audio
    id="music"
    preload="auto">

    <source
        src="music.mp3"
        type="audio/mpeg">

</audio>


<script>

/* ==================================================
   LỜI BÀI HÁT
================================================== */

const lyrics = [

    {
        text: "Em ơi anh đâu dễ dàng nói ra nên lời",
        time: 0.0,
        end: 5.2
    },

    {
        text: "Rằng trong lòng anh từ lâu cũng thấy rối bời",
        time: 5.2,
        end: 10.8
    },

    {
        text: "Nhưng hai ta nên chầm chậm thế thôi em à",
        time: 10.8,
        end: 16.1
    },

    {
        text: "Từ thích thích, thành yêu yêu, rồi thương thương",
        time: 16.1,
        end: 21.8
    },

    {
        text: "Ngày anh thấy, thấy tim đập nhanh lúc bên em",
        time: 21.8,
        end: 27.2
    },

    {
        text: "Là anh đã biết, biết anh chẳng có một đường lui",
        time: 27.2,
        end: 32.9
    },

    {
        text: "Thấy, thấy như trạm xăng với ôtô",
        time: 32.9,
        end: 37.8
    },

    {
        text: "Vì gặp em là anh chỉ đổ mà thôi",
        time: 37.8,
        end: 42.6
    },

    {
        text: "Nên em đành viết chiếc thư tình, thư tình",
        time: 42.6,
        end: 46.8
    },

    {
        text: "Để thay em nói hết tâm tư trong mình",
        time: 46.8,
        end: 50.0
    },

    {
        text: "Mong anh đừng nói những lời từ chối",
        time: 50.0,
        end: 52.3
    },

    {
        text: "Em chỉ cần biết tâm tư anh thế thôi",
        time: 52.3,
        end: 54.45
    }

];


/* ==================================================
   ELEMENT
================================================== */

const music =
    document.getElementById("music");

const openingLyrics =
    document.getElementById("openingLyrics");

const finalLyrics =
    document.getElementById("finalLyrics");

const musicButton =
    document.getElementById("musicButton");

const loadingBar =
    document.getElementById("loadingBar");

const loadingPercent =
    document.getElementById("loadingPercent");

const screenLyrics =
    document.getElementById("screenLyrics");

const screenPrepare =
    document.getElementById("screenPrepare");

const screenFinal =
    document.getElementById("screenFinal");


/* ==================================================
   BIẾN
================================================== */

let currentLyric = -1;

let prepareStarted = false;

let finalShown = false;

let celebrationStarted = false;


/* ==================================================
   CHUYỂN MÀN
================================================== */

function showScreen(screen) {

    document
        .querySelectorAll(".screen")
        .forEach(item => {

            item.classList.remove("active");

        });

    screen.classList.add("active");
}


/* ==================================================
   HIỆN LỜI
================================================== */

function showLyric(index) {

    if (index === currentLyric) {
        return;
    }

    currentLyric = index;


    /* Không có câu */
    if (index < 0) {

        openingLyrics.classList.remove("show");

        finalLyrics.classList.remove("show");

        return;
    }


    const text =
        lyrics[index].text;


    /*
     * TRƯỚC KHI MỞ QUÀ
     * lời ở giữa màn hình
     */

    if (!finalShown) {

        openingLyrics.classList.remove("show");

        setTimeout(() => {

            if (!finalShown) {

                openingLyrics.textContent =
                    text;

                openingLyrics.classList.add("show");

            }

        }, 220);

        return;
    }


    /*
     * SAU KHI MỞ QUÀ
     * lời nằm phía dưới
     */

    finalLyrics.classList.remove("show");

    setTimeout(() => {

        finalLyrics.textContent =
            text;

        finalLyrics.classList.add("show");

    }, 220);

}


/* ==================================================
   CẬP NHẬT LỜI THEO NHẠC
================================================== */

function updateLyrics() {

    const currentTime =
        music.currentTime;


    let index = -1;


    for (
        let i = 0;
        i < lyrics.length;
        i++
    ) {

        if (
            currentTime >= lyrics[i].time &&
            currentTime < lyrics[i].end
        ) {

            index = i;

            break;
        }

    }


    showLyric(index);


    /*
     * KHI CÒN 17 GIÂY
     * bắt đầu màn quà
     */

    if (
        music.duration &&
        !prepareStarted &&
        music.duration - currentTime <= 17
    ) {

        startPrepare();

    }

}


music.addEventListener(
    "timeupdate",
    updateLyrics
);


/* ==================================================
   BẮT ĐẦU 17 GIÂY CUỐI
================================================== */

function startPrepare() {

    if (prepareStarted) {
        return;
    }

    prepareStarted = true;


    /*
     * Lời cũ fade out.
     */

    openingLyrics.classList.remove("show");


    /*
     * Chuyển sang màn:
     * Thảo ơi
     * + quà
     * + loading
     */

    setTimeout(() => {

        showScreen(screenPrepare);

    }, 350);


    /*
     * Loading chạy từ 1 → 100
     * trong toàn bộ 17 giây cuối.
     */

    const startTime =
        music.currentTime;

    const endTime =
        music.duration;

    const totalTime =
        endTime - startTime;


    function updateLoading() {

        if (finalShown) {
            return;
        }


        const elapsed =
            music.currentTime - startTime;


        let progress =
            (elapsed / totalTime) * 100;


        progress =
            Math.max(
                1,
                Math.min(
                    100,
                    progress
                )
            );


        loadingBar.style.width =
            progress + "%";


        loadingPercent.textContent =
            Math.round(progress) + "%";


        if (
            progress >= 100 ||
            music.ended
        ) {

            openGift();

            return;
        }


        requestAnimationFrame(
            updateLoading
        );

    }


    updateLoading();

}


/* ==================================================
   MỞ QUÀ
================================================== */

function openGift() {

    if (finalShown) {
        return;
    }

    finalShown = true;


    /*
     * Màn quà fade out.
     */

    screenPrepare.style.opacity =
        "0";


    setTimeout(() => {

        /*
         * Sang Happy Birthday.
         */

        showScreen(screenFinal);


        screenPrepare.style.opacity =
            "";


        musicButton.style.display =
            "block";


        /*
         * HIỆU ỨNG
         */

        startCelebration();


        /*
         * Lấy đúng câu đang hát.
         */

        const currentTime =
            music.currentTime;


        let index = -1;


        for (
            let i = 0;
            i < lyrics.length;
            i++
        ) {

            if (
                currentTime >= lyrics[i].time &&
                currentTime < lyrics[i].end
            ) {

                index = i;

                break;
            }

        }


        if (index >= 0) {

            currentLyric =
                index;

            finalLyrics.textContent =
                lyrics[index].text;


            requestAnimationFrame(() => {

                finalLyrics.classList.add(
                    "show"
                );

            });

        }

    }, 700);

}


/* ==================================================
   TIM / HOA / BÓNG BAY
================================================== */

const emojis = [

    "💗",
    "💕",
    "💖",
    "💝",
    "❤️",
    "💘",

    "🌸",
    "🌷",
    "🌹",

    "🎀",

    "✨",
    "⭐",
    "🎈"

];


function createFloating() {

    const item =
        document.createElement("div");


    item.className =
        "floating";


    item.innerText =
        emojis[
            Math.floor(
                Math.random() *
                emojis.length
            )
        ];


    item.style.left =
        Math.random() * 100 +
        "vw";


    item.style.fontSize =
        (
            18 +
            Math.random() * 35
        ) + "px";


    item.style.animationDuration =
        (
            5 +
            Math.random() * 7
        ) + "s";


    document.body.appendChild(
        item
    );


    setTimeout(() => {

        item.remove();

    }, 13000);

}


/* ==================================================
   CONFETTI
================================================== */

function createConfetti() {

    const item =
        document.createElement("div");


    item.className =
        "confetti";


    item.style.left =
        Math.random() * 100 +
        "vw";


    item.style.background =
        `hsl(
            ${Math.random() * 360},
            80%,
            70%
        )`;


    item.style.animationDuration =
        (
            3 +
            Math.random() * 4
        ) + "s";


    document.body.appendChild(
        item
    );


    setTimeout(() => {

        item.remove();

    }, 8000);

}


/* ==================================================
   SPARKLE
================================================== */

function createSparkle() {

    const item =
        document.createElement("div");


    item.className =
        "sparkle";


    item.innerText =
        "✦";


    item.style.left =
        Math.random() * 100 +
        "vw";


    item.style.top =
        Math.random() * 100 +
        "vh";


    document.body.appendChild(
        item
    );


    setTimeout(() => {

        item.remove();

    }, 3000);

}


/* ==================================================
   BÙNG NỔ SINH NHẬT
================================================== */

function startCelebration() {

    if (celebrationStarted) {
        return;
    }

    celebrationStarted = true;


    /*
     * Ban đầu bùng nổ.
     */

    for (
        let i = 0;
        i < 100;
        i++
    ) {

        setTimeout(
            createFloating,
            i * 25
        );

    }


    for (
        let i = 0;
        i < 140;
        i++
    ) {

        setTimeout(
            createConfetti,
            i * 18
        );

    }


    for (
        let i = 0;
        i < 50;
        i++
    ) {

        setTimeout(
            createSparkle,
            i * 70
        );

    }


    /*
     * Sau đó tiếp tục bay nhẹ.
     */

    setInterval(
        createFloating,
        350
    );


    setInterval(
        createConfetti,
        180
    );


    setInterval(
        createSparkle,
        500
    );

}


/* ==================================================
   NÚT NHẠC
================================================== */

musicButton.addEventListener(
    "click",
    () => {

        if (music.paused) {

            music.play()
                .then(() => {

                    musicButton.innerText =
                        "🔊";

                });

        } else {

            music.pause();

            musicButton.innerText =
                "🔇";

        }

    }
);


/* ==================================================
   NHẠC HẾT
================================================== */

music.addEventListener(
    "ended",
    () => {

        /*
         * Lời cuối fade out.
         */

        finalLyrics.classList.remove(
            "show"
        );

        openingLyrics.classList.remove(
            "show"
        );

    }
);


/* ==================================================
   TỰ CHẠY NHẠC
================================================== */

window.addEventListener(
    "load",
    () => {

        music.volume = 1;

        music.currentTime = 0;


        /*
         * Thử autoplay.
         */

        music.play()
            .then(() => {

                musicButton.innerText =
                    "🔊";

            })
            .catch(() => {

                /*
                 * Chrome có thể chặn
                 * autoplay có tiếng.
                 *
                 * Click đầu tiên trên web
                 * sẽ kích hoạt nhạc.
                 */

                musicButton.innerText =
                    "▶️";

            });

    }
);


/* ==================================================
   NẾU TRÌNH DUYỆT CHẶN AUTOPLAY
   → click đầu tiên là chạy nhạc
================================================== */

document.addEventListener(
    "click",
    () => {

        if (
            music.paused &&
            !music.ended
        ) {

            music.play()
                .then(() => {

                    musicButton.innerText =
                        "🔊";

                })
                .catch(() => {});

        }

    },
    {
        once: true
    }
);

</script>
