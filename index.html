<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Birthday Thảo 💗</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;500;600;700&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;
    font-family: "Quicksand", sans-serif;
}


/* =========================================
   TẤT CẢ MÀN HÌNH
========================================= */

.screen {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    text-align: center;

    opacity: 0;
    visibility: hidden;

    transition: opacity .8s ease;
}

.screen.active {
    opacity: 1;
    visibility: visible;
}


/* =========================================
   MÀN 1
   KHÔNG TIM - KHÔNG HOA
========================================= */

#screen1 {
    background:
        linear-gradient(
            135deg,
            #f8f8f8,
            #eeeeee
        );

    color: #333;
}


/* Tiêu đề */

.intro-title {
    font-size: clamp(32px, 6vw, 48px);

    font-weight: 700;

    color: #333;

    margin-bottom: 12px;
}


/* Dòng chữ */

.intro-text {
    font-size: 17px;

    color: #888;

    margin-bottom: 25px;
}


/* =========================================
   HỘP QUÀ
========================================= */

.gift {
    font-size: 125px;

    cursor: pointer;

    user-select: none;

    animation:
        giftFloat 2s ease-in-out infinite;

    transition:
        transform .25s ease,
        filter .25s ease;
}


/* Rê chuột */

.gift:hover {
    transform:
        scale(1.15)
        rotate(-6deg);

    filter:
        drop-shadow(
            0 18px 18px
            rgba(0,0,0,.18)
        );
}


/* Bấm */

.gift:active {
    transform:
        scale(.8)
        rotate(5deg);
}


/* Chữ gợi ý */

.gift-hint {
    margin-top: 12px;

    font-size: 14px;

    color: #999;

    animation:
        hintBlink 1.8s infinite;
}


/* =========================================
   MÀN 2
========================================= */

#screen2 {
    background: #f4f4f5;

    color: #333;
}

.loading-title {
    font-size: 28px;

    font-weight: 600;

    margin-bottom: 25px;
}


/* Thanh loading */

.loading-box {
    width: min(330px, 75vw);

    height: 13px;

    background: #ddd;

    border-radius: 30px;

    overflow: hidden;
}


/* Thanh chạy */

.loading-bar {
    width: 0%;

    height: 100%;

    background:
        linear-gradient(
            90deg,
            #555,
            #888
        );

    border-radius: 30px;

    transition:
        width 2.5s linear;
}


/* Phần trăm */

.loading-percent {
    margin-top: 12px;

    color: #999;

    font-size: 14px;
}


/* Nút */

.continue-button {
    display: none;

    margin-top: 30px;

    border: none;

    background: #333;

    color: white;

    padding: 14px 32px;

    border-radius: 50px;

    font-family:
        "Quicksand",
        sans-serif;

    font-size: 16px;

    font-weight: 600;

    cursor: pointer;

    transition: .3s;
}

.continue-button:hover {
    transform: scale(1.07);

    background: #222;
}


/* =========================================
   MÀN 3 - ĐẾM NGƯỢC
========================================= */

#screen3 {
    background: #f5f5f6;
}

.countdown {
    font-size: clamp(
        90px,
        16vw,
        160px
    );

    font-weight: 700;

    color: #333;

    animation:
        countdownPop 1s ease;
}


/* =========================================
   MÀN CUỐI
========================================= */

#screen4 {

    background:
        radial-gradient(
            circle at 50% 45%,
            #fff8fc 0%,
            #ffe0ed 40%,
            #eadcff 100%
        );

    overflow: hidden;
}


/* Ánh sáng góc */

#screen4::before {

    content: "";

    position: absolute;

    width: 450px;
    height: 450px;

    border-radius: 50%;

    background:
        rgba(255,255,255,.5);

    filter: blur(90px);

    top: -180px;
    left: -120px;
}


/* Ánh sáng góc dưới */

#screen4::after {

    content: "";

    position: absolute;

    width: 450px;
    height: 450px;

    border-radius: 50%;

    background:
        rgba(198,165,255,.3);

    filter: blur(90px);

    bottom: -180px;
    right: -120px;
}


/* =========================================
   DÒNG NHỎ
========================================= */

.final-small {

    position: relative;

    z-index: 10;

    font-size: clamp(
        13px,
        2vw,
        19px
    );

    font-weight: 600;

    letter-spacing: 4px;

    color: #b24f82;

    margin-bottom: 10px;

    animation:
        fadeDown 1.2s ease;
}


/* =========================================
   HAPPY BIRTHDAY
========================================= */

.final-title {

    position: relative;

    z-index: 10;

    font-family:
        "Pacifico",
        cursive;

    font-size: clamp(
        58px,
        12vw,
        150px
    );

    line-height: 1.15;

    background:
        linear-gradient(
            90deg,
            #ff4b98,
            #bd5cff,
            #ff65a9,
            #ff4b98
        );

    background-size: 300%;

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;

    text-shadow:
        0 10px 35px
        rgba(220,70,150,.25);

    animation:
        rainbowText 5s linear infinite,
        titleFloat 3s ease-in-out infinite;
}


/* =========================================
   THẢO
========================================= */

.final-name {

    position: relative;

    z-index: 10;

    font-family:
        "Pacifico",
        cursive;

    font-size: clamp(
        55px,
        11vw,
        120px
    );

    color: #d83d87;

    line-height: 1.15;

    margin-top: 5px;

    text-shadow:
        0 5px 0 white,
        0 12px 30px
        rgba(200,55,125,.25);

    animation:
        nameBeat 2s infinite;
}


/* =========================================
   BÁNH SINH NHẬT
========================================= */

.cake {

    position: relative;

    z-index: 10;

    font-size:
        clamp(
            55px,
            7vw,
            80px
        );

    margin: 10px 0;

    animation:
        cakeFloat 3s ease-in-out infinite;
}


/* =========================================
   LỜI CHÚC
========================================= */

.message {

    position: relative;

    z-index: 10;

    width:
        min(
            90%,
            650px
        );

    padding:
        20px 28px;

    background:
        rgba(
            255,
            255,
            255,
            .62
        );

    backdrop-filter:
        blur(15px);

    -webkit-backdrop-filter:
        blur(15px);

    border:
        1px solid
        rgba(
            255,
            255,
            255,
            .8
        );

    border-radius:
        28px;

    color: #70455f;

    font-size:
        clamp(
            15px,
            2vw,
            18px
        );

    line-height: 1.7;

    box-shadow:
        0 15px 50px
        rgba(
            150,
            70,
            130,
            .15
        );

    animation:
        messageAppear 1.5s ease;
}


.message strong {
    color: #df3f8d;
}


/* =========================================
   TIM - HOA - BÓNG BAY
========================================= */

.floating {

    position: fixed;

    pointer-events: none;

    user-select: none;

    z-index: 30;

    animation:
        floatUp
        linear
        forwards;
}


/* =========================================
   CONFETTI
========================================= */

.confetti {

    position: fixed;

    width: 8px;

    height: 16px;

    border-radius: 3px;

    top: -30px;

    pointer-events: none;

    z-index: 20;

    animation:
        confettiFall
        linear
        forwards;
}


/* =========================================
   SAO
========================================= */

.sparkle {

    position: fixed;

    pointer-events: none;

    z-index: 25;

    color: white;

    font-size: 22px;

    text-shadow:
        0 0 12px white;

    animation:
        sparkleAnim
        2s ease-in-out
        infinite;
}


/* =========================================
   ANIMATION
========================================= */

@keyframes giftFloat {

    0%,
    100% {
        transform:
            translateY(0);
    }

    50% {
        transform:
            translateY(-14px)
            rotate(-3deg);
    }
}


@keyframes hintBlink {

    0%,
    100% {
        opacity: .4;
    }

    50% {
        opacity: 1;
    }
}


@keyframes countdownPop {

    0% {
        transform:
            scale(2);

        opacity: 0;
    }

    100% {
        transform:
            scale(1);

        opacity: 1;
    }
}


@keyframes rainbowText {

    0% {
        background-position: 0%;
    }

    100% {
        background-position: 300%;
    }
}


@keyframes titleFloat {

    0%,
    100% {
        transform:
            translateY(0);
    }

    50% {
        transform:
            translateY(-9px);
    }
}


@keyframes nameBeat {

    0%,
    100% {
        transform:
            scale(1);
    }

    50% {
        transform:
            scale(1.06);
    }
}


@keyframes cakeFloat {

    0%,
    100% {
        transform:
            translateY(0)
            rotate(-2deg);
    }

    50% {
        transform:
            translateY(-12px)
            rotate(2deg);
    }
}


@keyframes fadeDown {

    from {
        opacity: 0;

        transform:
            translateY(-25px);
    }

    to {
        opacity: 1;

        transform:
            translateY(0);
    }
}


@keyframes messageAppear {

    from {
        opacity: 0;

        transform:
            translateY(30px)
            scale(.95);
    }

    to {
        opacity: 1;

        transform:
            translateY(0)
            scale(1);
    }
}


@keyframes floatUp {

    0% {
        transform:
            translateY(110vh)
            rotate(0deg);

        opacity: 0;
    }

    10% {
        opacity: 1;
    }

    50% {
        transform:
            translateY(50vh)
            translateX(35px)
            rotate(180deg);
    }

    100% {
        transform:
            translateY(-15vh)
            translateX(-35px)
            rotate(360deg);

        opacity: 0;
    }
}


@keyframes confettiFall {

    0% {
        transform:
            translateY(-30px)
            rotate(0deg);

        opacity: 0;
    }

    10% {
        opacity: 1;
    }

    100% {
        transform:
            translateY(110vh)
            rotate(720deg);

        opacity: 0;
    }
}


@keyframes sparkleAnim {

    0%,
    100% {
        opacity: 0;

        transform:
            scale(.4);
    }

    50% {
        opacity: 1;

        transform:
            scale(1.4);
    }
}


/* =========================================
   ĐIỆN THOẠI
========================================= */

@media(max-width:600px) {

    .intro-title {
        font-size: 30px;
    }

    .intro-text {
        font-size: 15px;
    }

    .gift {
        font-size: 105px;
    }

    .loading-title {
        font-size: 23px;
    }

    .final-small {
        letter-spacing: 2px;
    }

    .message {
        padding:
            17px 20px;
    }
}

</style>
</head>


<body>


<!-- ==================================================
     MÀN 1
================================================== -->

<section
    id="screen1"
    class="screen active"
>

    <div class="intro-title">
        Thảo ơi
    </div>

    <div class="intro-text">
        Có một món nhỏ dành cho Thảo nè...
    </div>


    <!--
        BẤM TRỰC TIẾP VÀO HỘP QUÀ
    -->

    <div
        class="gift"
        onclick="startSurprise()"
        title="Bấm vào món quà"
    >
        🎁
    </div>


    <div class="gift-hint">
        Bấm vào món quà nha
    </div>

</section>



<!-- ==================================================
     MÀN 2
================================================== -->

<section
    id="screen2"
    class="screen"
>

    <div class="loading-title">
        Đang chuẩn bị...
    </div>


    <div class="loading-box">

        <div
            class="loading-bar"
            id="loadingBar"
        ></div>

    </div>


    <div
        class="loading-percent"
        id="percent"
    >
        0%
    </div>


    <button
        class="continue-button"
        id="continueBtn"
        onclick="goCountdown()"
    >
        Tiếp tục
    </button>

</section>



<!-- ==================================================
     MÀN 3
================================================== -->

<section
    id="screen3"
    class="screen"
>

    <div
        class="countdown"
        id="countdown"
    >
        3
    </div>

</section>



<!-- ==================================================
     MÀN CUỐI
================================================== -->

<section
    id="screen4"
    class="screen"
>

    <div class="final-small">
        ✨ HÔM NAY CÓ MỘT NGƯỜI ĐẶC BIỆT ✨
    </div>


    <div class="final-title">
        Happy Birthday
    </div>


    <div class="final-name">
        Thảo 💗
    </div>


    <div class="cake">
        🎂
    </div>


    <div class="message">

        Chúc Thảo sinh nhật vui vẻ,
        tuổi mới luôn vui vẻ và hạnh phúc nhé 💕
        <br>

        Mong những điều tốt đẹp nhất
        sẽ luôn đến với Thảo.
        <br>

        <strong>
            Happy Birthday cô gái đáng yêu 🎀💗
        </strong>

    </div>

</section>



<script>

/* ==================================================
   CHUYỂN MÀN HÌNH
================================================== */

function showScreen(id) {

    document
        .querySelectorAll(".screen")
        .forEach(screen => {

            screen.classList.remove(
                "active"
            );

        });


    document
        .getElementById(id)
        .classList.add(
            "active"
        );
}



/* ==================================================
   CLICK VÀO HỘP QUÀ
================================================== */

function startSurprise() {

    /*
        Chuyển sang màn chuẩn bị
    */

    showScreen("screen2");


    const bar =
        document.getElementById(
            "loadingBar"
        );


    const percent =
        document.getElementById(
            "percent"
        );


    const button =
        document.getElementById(
            "continueBtn"
        );


    let value = 0;


    /*
        Cho thanh loading chạy
    */

    setTimeout(() => {

        bar.style.width =
            "100%";

    }, 100);


    /*
        Chạy số phần trăm
    */

    const timer =
        setInterval(() => {

            value++;


            percent.innerText =
                value + "%";


            if(value >= 100) {

                clearInterval(timer);


                setTimeout(() => {

                    button.style.display =
                        "block";

                }, 500);

            }

        }, 25);

}



/* ==================================================
   COUNTDOWN
================================================== */

function goCountdown() {

    showScreen("screen3");


    let number = 3;


    const counter =
        document.getElementById(
            "countdown"
        );


    counter.innerText =
        number;


    const timer =
        setInterval(() => {

            number--;


            if(number > 0) {

                counter.innerText =
                    number;


                /*
                    Reset animation
                */

                counter.style.animation =
                    "none";

                void counter.offsetWidth;

                counter.style.animation =
                    "countdownPop 1s ease";

            }

            else {

                clearInterval(timer);


                counter.innerText =
                    "🎁";


                setTimeout(() => {

                    showScreen(
                        "screen4"
                    );


                    startCelebration();

                }, 800);

            }

        }, 1000);

}



/* ==================================================
   DANH SÁCH HIỆU ỨNG
================================================== */

const emojis = [

    "💗",
    "💕",
    "💖",
    "💝",
    "❤️",
    "💘",

    "🌸",
    "🌷",
    "🌹",

    "🎀",

    "✨",
    "⭐",

    "🎈"

];



/* ==================================================
   TẠO TIM / HOA / BÓNG BAY
================================================== */

function createFloating() {

    const item =
        document.createElement(
            "div"
        );


    item.className =
        "floating";


    item.innerText =
        emojis[
            Math.floor(
                Math.random()
                *
                emojis.length
            )
        ];


    item.style.left =
        Math.random() * 100
        + "vw";


    item.style.fontSize =
        (
            18
            +
            Math.random() * 35
        )
        + "px";


    item.style.animationDuration =
        (
            5
            +
            Math.random() * 7
        )
        + "s";


    document.body.appendChild(
        item
    );


    setTimeout(() => {

        item.remove();

    }, 13000);

}



/* ==================================================
   TẠO CONFETTI
================================================== */

function createConfetti() {

    const item =
        document.createElement(
            "div"
        );


    item.className =
        "confetti";


    item.style.left =
        Math.random() * 100
        + "vw";


    item.style.background =
        `hsl(
            ${Math.random() * 360},
            80%,
            70%
        )`;


    item.style.animationDuration =
        (
            3
            +
            Math.random() * 4
        )
        + "s";


    document.body.appendChild(
        item
    );


    setTimeout(() => {

        item.remove();

    }, 8000);

}



/* ==================================================
   TẠO SAO LẤP LÁNH
================================================== */

function createSparkle() {

    const item =
        document.createElement(
            "div"
        );


    item.className =
        "sparkle";


    item.innerText =
        "✦";


    item.style.left =
        Math.random() * 100
        + "vw";


    item.style.top =
        Math.random() * 100
        + "vh";


    item.style.animationDelay =
        Math.random() * 2
        + "s";


    document.body.appendChild(
        item
    );


    setTimeout(() => {

        item.remove();

    }, 3000);

}



/* ==================================================
   BÙNG NỔ MÀN CUỐI
================================================== */

function startCelebration() {


    /*
        Đợt đầu:
        rất nhiều hiệu ứng bung ra
    */

    for(
        let i = 0;
        i < 100;
        i++
    ) {

        setTimeout(
            createFloating,
            i * 25
        );

    }


    for(
        let i = 0;
        i < 140;
        i++
    ) {

        setTimeout(
            createConfetti,
            i * 18
        );

    }


    for(
        let i = 0;
        i < 50;
        i++
    ) {

        setTimeout(
            createSparkle,
            i * 70
        );

    }


    /*
        Sau đó hiệu ứng vẫn tiếp tục
    */

    setInterval(
        createFloating,
        350
    );


    setInterval(
        createConfetti,
        180
    );


    setInterval(
        createSparkle,
        500
    );

}

</script>

</body>
</html>
